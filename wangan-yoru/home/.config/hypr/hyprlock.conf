# Wangan yoru lock screen. Left: a 24-hour tachometer arc that fills in amber up to
# the current time, red zone from 22 to 24; inside it the clock in Zen Dots, the
# date, and the password capsule. Right: the saying in vertical RocknRoll One
# columns (tategaki, read right to left) with its romaji turned 90 degrees
# beside it. No username. Sayings: ~/.config/hypr/wangan-yoru/sayings.txt.
# hyprlock draws no arcs: the dial is an image. lock-arc.png (the dial alone,
# from build-art.py) shows first; ~/.local/bin/wangan-lock-arc then renders the
# current time and hyprlock reloads it (the helper only re-renders when the
# minute changed). The capsule is lock-field.png under a transparent field.
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/wangan-yoru/wallpaper.png
    color = rgb(0B0D11)
    blur_passes = 2
    blur_size = 3
    brightness = 0.42
    vibrancy = 0
    noise = 0.01
}

# ---- left: the dial, clock, date, field ---------------------------------

image {
    monitor =
    path = ~/.config/hypr/wangan-yoru/lock-arc.png
    size = 1000
    rounding = 0
    border_size = 0
    reload_time = 2
    reload_cmd = $HOME/.local/bin/wangan-lock-arc
    position = -370, -20
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgba(EEF1F5FF)
    font_size = 112
    font_family = Zen Dots
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(2A5FC4FF)
    shadow_boost = 0.9
    position = -370, 66
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000' weight='500'>$(date +'%A, %-d %B')</span>"
    color = rgba(C9D0DBFF)
    font_size = 16
    font_family = M PLUS 1p
    position = -370, -44
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = ~/.config/hypr/wangan-yoru/lock-field.png
    size = 54
    rounding = 0
    border_size = 0
    position = -370, -136
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 400, 54
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(EEF1F5FF)
    font_family = DotGothic16
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##8C97A8">password</span>
    fail_text = <span foreground="##FF5A5E">$FAIL</span>
    check_text = <span foreground="##5B8DEF">verifying</span>
    zindex = 2
    position = -370, -136
    halign = center
    valign = center
}

# ---- right: the saying, tategaki -----------------------------------------

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/wangan-lock-saying jp1
    color = rgba(EEF1F5FF)
    font_size = 128
    font_family = RocknRoll One
    text_align = center
    position = -180, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/wangan-lock-saying jp2
    color = rgba(EEF1F5FF)
    font_size = 128
    font_family = RocknRoll One
    text_align = center
    position = -366, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/wangan-lock-saying romaji
    color = rgba(C9D0DBFF)
    font_size = 10
    font_family = Zen Dots
    rotate = 90
    position = -570, 250
    halign = right
    valign = center
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>WANGAN</span>
    color = rgba(5F6A7CFF)
    font_size = 8
    font_family = Zen Dots
    position = 0, 36
    halign = center
    valign = bottom
}
