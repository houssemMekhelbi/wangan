<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Wangan type (the same in both variants):
       display    Zen Dots        + Changa (Arabic), RocknRoll One (Japanese): bar labels, lock clock, banner names
       saying     RocknRoll One   lock saying
       LCD        DotGothic16     bar values, banner details; drawn for 16px, used at 16px
       interface  M PLUS 1p       + IBM Plex Sans Arabic (it carries its own Japanese)
       terminal   M PLUS 1 Code   + IBM Plex Sans Arabic, JetBrains Mono Nerd Font
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. M PLUS 1 Code has no powerline/Nerd glyphs;
     JetBrains Mono Nerd Font supplies them (the pill ends in tmux and the prompt). -->
<fontconfig>
  <alias binding="same">
    <family>M PLUS 1p</family>
    <accept><family>IBM Plex Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Zen Dots</family>
    <accept><family>Changa</family><family>RocknRoll One</family></accept>
  </alias>
  <alias binding="same">
    <family>DotGothic16</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>
  <alias binding="same">
    <family>M PLUS 1 Code</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>M PLUS 1p</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>M PLUS 1p</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>M PLUS 1 Code</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
