# Wangan yoru tmux. Status at the bottom on the panel colour. Every block is a
# pill, like the rest of the theme: it opens with the left half circle
# (\ue0b6) and closes with the right one (\ue0b4), in the block's colour
# on the panel. The session name is a blue pill, the current window an amber
# one, the clock a raised one. The half circles are Nerd Font glyphs
# (JetBrains Mono Nerd Font supplies them behind M PLUS 1 Code).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#12161D,fg=#8C97A8"

set -g status-left-length 44
set -g status-left "#[bg=#12161D,fg=#2A5FC4]\ue0b6#[bg=#2A5FC4,fg=#EEF1F5]#{=/24/\u2026:session_name}#[bg=#12161D,fg=#2A5FC4]\ue0b4 "

set -g status-right-length 40
set -g status-right "#[bg=#12161D,fg=#1A2029]\ue0b6#[bg=#1A2029,fg=#EEF1F5]%H:%M#[bg=#12161D,fg=#1A2029]\ue0b4"

# Windows are plain index:name. The current one is an amber pill, others
# muted, activity in blue.
set -g window-status-separator ""
set -g window-status-format "#[fg=#8C97A8] #{?window_activity_flag,#[fg=#5B8DEF],}#I:#W "
set -g window-status-current-format "#[bg=#12161D,fg=#F2A33A]\ue0b6#[bg=#F2A33A,fg=#0B0D11,bold]#I:#W#[bg=#12161D,fg=#F2A33A,nobold]\ue0b4"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active blue, inactive hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#2a323f"
set -g pane-active-border-style "fg=#5b8def"
set -g pane-border-indicators off

set -g message-style "bg=#1A2029,fg=#EEF1F5"
set -g message-command-style "bg=#1A2029,fg=#F2A33A"
set -g mode-style "bg=#2A5FC4,fg=#EEF1F5"
set -g copy-mode-match-style "bg=#1A2029,fg=#5B8DEF,underscore"
set -g copy-mode-current-match-style "bg=#F2A33A,fg=#0B0D11"
set -g menu-style "bg=#0B0D11,fg=#8C97A8"
set -g menu-selected-style "bg=#2A5FC4,fg=#EEF1F5"
set -g menu-border-style "fg=#5B8DEF"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#5B8DEF"
set -g popup-border-lines rounded
set -g display-panes-colour "#2A323F"
set -g display-panes-active-colour "#F2A33A"
set -g clock-mode-colour "#F2A33A"
