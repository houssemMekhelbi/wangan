# Wangan yoru terminal. Night at 90% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=M PLUS 1 Code:size=11
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.90
blur=yes
background=0B0D11
foreground=C9D0DB
cursor=0B0D11 F2A33A
regular0=0B0D11
regular1=FF5A5E
regular2=7BD0A0
regular3=F2A33A
regular4=5B8DEF
regular5=A98BF0
regular6=5CC8D8
regular7=8C97A8
bright0=5F6A7C
bright1=FF8588
bright2=9BE0B8
bright3=F7C16E
bright4=8AAEF5
bright5=C3AEF7
bright6=8ADBE6
bright7=EEF1F5
selection-foreground=EEF1F5
selection-background=1A2029
jump-labels=0B0D11 F2A33A
scrollback-indicator=0B0D11 5B8DEF
search-box-no-match=0B0D11 FF5A5E
search-box-match=0B0D11 F2A33A
urls=5B8DEF

[colors-light]
