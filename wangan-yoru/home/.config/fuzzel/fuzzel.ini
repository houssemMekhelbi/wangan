# Wangan yoru launcher for fuzzel (unused: SUPER+D runs wangan-launcher, foot + fzf).

[main]
font=M PLUS 1p:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=12161DF7
text=8C97A8FF
message=8C97A8FF
prompt=F2A33AFF
placeholder=5F6A7CFF
input=EEF1F5FF
match=5B8DEFFF
selection=1A2029FF
selection-text=EEF1F5FF
selection-match=F2A33AFF
counter=5B8DEFFF
border=5B8DEFFF

[border]
width=1
radius=3
