# Wangan asa terminal. Night at 95% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=M PLUS 1 Code:size=11
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.95
blur=yes
background=E4E8EE
foreground=2A3240
cursor=E4E8EE 8F5200
regular0=10151D
regular1=B3161D
regular2=2F6E5A
regular3=8F5200
regular4=1F4FA8
regular5=5A3FB0
regular6=1F6F82
regular7=4E596B
bright0=6B7587
bright1=9E1219
bright2=245A49
bright3=7A4600
bright4=17408C
bright5=4A3296
bright6=175C6C
bright7=10151D
selection-foreground=10151D
selection-background=D5DCE7
jump-labels=E4E8EE 8F5200
scrollback-indicator=E4E8EE 1F4FA8
search-box-no-match=E4E8EE B3161D
search-box-match=E4E8EE 8F5200
urls=1F4FA8

