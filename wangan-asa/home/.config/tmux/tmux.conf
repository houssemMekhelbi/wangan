# Wangan asa tmux. Status at the bottom on the panel colour. Every block is a
# pill, like the rest of the theme: it opens with the left half circle
# (\ue0b6) and closes with the right one (\ue0b4), in the block's colour
# on the panel. The session name is a blue pill, the current window an amber
# one, the clock a raised one. The half circles are Nerd Font glyphs
# (JetBrains Mono Nerd Font supplies them behind M PLUS 1 Code).

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#F2F4F8,fg=#4E596B"

set -g status-left-length 44
set -g status-left "#[bg=#F2F4F8,fg=#2A5FC4]\ue0b6#[bg=#2A5FC4,fg=#FFFFFF]#{=/24/\u2026:session_name}#[bg=#F2F4F8,fg=#2A5FC4]\ue0b4 "

set -g status-right-length 40
set -g status-right "#[bg=#F2F4F8,fg=#D5DCE7]\ue0b6#[bg=#D5DCE7,fg=#10151D]%H:%M#[bg=#F2F4F8,fg=#D5DCE7]\ue0b4"

# Windows are plain index:name. The current one is an amber pill, others
# muted, activity in blue.
set -g window-status-separator ""
set -g window-status-format "#[fg=#4E596B] #{?window_activity_flag,#[fg=#1F4FA8],}#I:#W "
set -g window-status-current-format "#[bg=#F2F4F8,fg=#F2A33A]\ue0b6#[bg=#F2A33A,fg=#10151D,bold]#I:#W#[bg=#F2F4F8,fg=#F2A33A,nobold]\ue0b4"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active blue, inactive hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#b7c0cd"
set -g pane-active-border-style "fg=#1f4fa8"
set -g pane-border-indicators off

set -g message-style "bg=#D5DCE7,fg=#10151D"
set -g message-command-style "bg=#D5DCE7,fg=#8F5200"
set -g mode-style "bg=#2A5FC4,fg=#FFFFFF"
set -g copy-mode-match-style "bg=#D5DCE7,fg=#1F4FA8,underscore"
set -g copy-mode-current-match-style "bg=#F2A33A,fg=#10151D"
set -g menu-style "bg=#E4E8EE,fg=#4E596B"
set -g menu-selected-style "bg=#2A5FC4,fg=#FFFFFF"
set -g menu-border-style "fg=#1F4FA8"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#1F4FA8"
set -g popup-border-lines rounded
set -g display-panes-colour "#B7C0CD"
set -g display-panes-active-colour "#8F5200"
set -g clock-mode-colour "#8F5200"
