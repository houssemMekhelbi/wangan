# Wangan asa launcher for fuzzel (unused: SUPER+D runs wangan-launcher, foot + fzf).

[main]
font=M PLUS 1p:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=F2F4F8F7
text=4E596BFF
message=4E596BFF
prompt=8F5200FF
placeholder=7D8899FF
input=10151DFF
match=1F4FA8FF
selection=D5DCE7FF
selection-text=10151DFF
selection-match=8F5200FF
counter=1F4FA8FF
border=1F4FA8FF

[border]
width=1
radius=3
